# Assemble l'application en une APK installable, signée avec la clé de release déposée en
# secret, ou à défaut avec la clé de debug pour que le build reste possible sans clé.
name: APK installable

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# Écriture nécessaire pour publier l'APK dans une release.
permissions:
  contents: write

# Un push qui en remplace un autre sur la même référence annule le build précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assembler les APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_APK: a-release.apk

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # AGP 9.1.1 exige JDK 17 au minimum.
      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fournit le SDK Android et accepte les licences, sans quoi AGP ne peut pas
      # télécharger la plateforme compileSdk 36.1.
      #
      # `packages: tools platform-tools` est la valeur par défaut de l'action, et elle est
      # désormais cassée : Google a retiré le paquet `tools` de son dépôt, si bien que sdkmanager
      # échoue sur « Failed to find package 'tools' » avant même que le build ne commence. Le
      # paquet était de toute façon obsolète et inutile ici — AGP télécharge lui-même la
      # plateforme et les build-tools dont il a besoin. On ne demande donc que platform-tools.
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Met en cache les dépendances et la distribution Gradle entre deux exécutions.
      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      # Clé de signature de release, si elle a été déposée en secret.
      #
      # Le keystore est écrit dans RUNNER_TEMP, **en dehors du dépôt** : il ne peut donc ni être
      # committé par accident, ni se retrouver dans un artefact. Les mots de passe passent par
      # GITHUB_ENV, où GitHub les masque dans les journaux.
      #
      # Absence de secret = repli sur la clé de debug, et le build continue. Une intégration
      # continue qui échouerait faute de clé empêcherait quiconque de cloner le dépôt et de
      # vérifier que l'application compile.
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Aucune clé de release fournie : signature avec la clé de debug."
            echo "SIGNED_WITH=debug" >> "$GITHUB_ENV"
            exit 0
          fi

          keystore="$RUNNER_TEMP/release.jks"
          # `base64 -d` échoue sur une chaîne mal encodée, et `set -e` fait alors échouer le
          # build : mieux vaut s'arrêter ici que produire une APK de debug présentée comme signée.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::Le keystore décodé est vide : vérifiez RELEASE_KEYSTORE_BASE64."
            exit 1
          fi

          {
            echo "KEYSTORE_PATH=$keystore"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            echo "SIGNED_WITH=release"
          } >> "$GITHUB_ENV"
          echo "Clé de release chargée ($(du -h "$keystore" | cut -f1))."

      # Les tests du moteur gestuel tournent sur JVM : quelques secondes, sans émulateur.
      # Ils s'exécutent avant l'assemblage pour échouer au plus tôt.
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      # Artefact secondaire : son échec (quota de stockage saturé, par exemple) ne doit pas
      # masquer le résultat des tests eux-mêmes.
      - name: Publier les rapports de test
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3

      # Une seule variante.
      #
      # Le build produisait aussi une APK debug, qui servait de témoin : le moteur de vision
      # fonctionnait en debug et échouait en release, et comme les deux variantes ne différaient
      # que par R8, l'écart entre elles désignait la cause. La minification étant désormais
      # désactivée, les deux archives sont fonctionnellement identiques : la seconde ne répond
      # plus à aucune question et doublait la durée du build.
      #
      # Si la minification est réactivée, rétablir `assembleDebug` et la comparaison des dex
      # supprimée plus bas : c'est le seul garde-fou contre une classe retirée par R8, un défaut
      # qui ne produit aucune erreur de compilation.
      #
      # starkDebugSigning n'est passé **que** faute de clé de release : il est le repli, pas le
      # mode normal. Avec une clé fournie, Gradle la préfère de toute façon, mais ne pas passer
      # l'option rend l'intention lisible — et fait échouer le build si la clé n'a pas été prise
      # en compte, au lieu de retomber silencieusement sur la clé de debug.
      - name: Assembler l'APK
        run: |
          set -euo pipefail
          if [ "${SIGNED_WITH:-debug}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleRelease -PstarkDebugSigning=true
          fi

      - name: Vérifier que l'APK est signée
        run: |
          set -euo pipefail

          check() {
            local apk="$1" label="$2"
            if [ ! -f "$apk" ]; then
              echo "::error::APK $label introuvable ($apk)"
              exit 1
            fi
            echo "$label : $(du -h "$apk" | cut -f1)"
            # Une APK signée porte un bloc de signature v1 (META-INF/*.RSA) ou v2/v3
            # (APK Signing Block, invisible dans la liste zip). apksigner tranche sans ambiguïté.
            local apksigner certs
            apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
            if ! certs=$("$apksigner" verify --print-certs "$apk" 2>&1); then
              echo "::error::$label n'est pas signée : elle ne pourra pas être installée."
              exit 1
            fi

            # Le certificat est affiché, et non seulement vérifié : c'est la seule façon de voir
            # *quelle* clé a signé. Son empreinte est aussi l'identité de l'application pour
            # Android — deux builds signés par des clés différentes ne se mettent pas à jour l'un
            # l'autre, ils se refusent.
            echo "$certs" | grep -E 'Signer #1 certificate (DN|SHA-256 digest)' || true

            # Garde-fou contre le cas le plus trompeur : une clé de release demandée, un secret mal
            # formé, et une APK de debug publiée comme si elle était signée. Le certificat de debug
            # d'Android porte toujours ce nom.
            if [ "${SIGNED_WITH:-debug}" = "release" ] && \
               echo "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error::Signature de release demandée, mais l'APK porte le certificat de debug."
              exit 1
            fi
            if [ "${SIGNED_WITH:-debug}" = "debug" ] && \
               ! echo "$certs" | grep -q 'CN=Android Debug'; then
              echo "::warning::APK signée par une clé inattendue alors qu'aucune clé de release n'était fournie."
            fi
            echo "  signature vérifiée (clé : ${SIGNED_WITH:-debug})"
          }

          release=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          check "$release" "release"

          cp "$release" "$RELEASE_APK"

      # Diagnostic d'empaquetage. Un « module de vision indisponible » sur appareil a trois
      # causes possibles, que cette étape distingue sans avoir besoin du téléphone :
      #   1. le modèle absent de l'archive ;
      #   2. les bibliothèques natives de MediaPipe absentes ;
      #   3. des segments ELF alignés sur 4 Ko, que les appareils Android 15+ à pages de 16 Ko
      #      refusent de charger — le cas le plus insidieux, car tout compile normalement.
      - name: Diagnostic de l'APK
        run: |
          set -euo pipefail

          python3 - "$RELEASE_APK" <<'PY'
          import io, sys, zipfile
          apk = zipfile.ZipFile(sys.argv[1])
          names = apk.namelist()

          model = [n for n in names if n.startswith("assets/")]
          print("## Assets embarqués")
          if not model:
              print("::error::Aucun asset dans l'APK : le modèle n'a pas été empaqueté.")
              sys.exit(1)
          for info in apk.infolist():
              if info.filename.startswith("assets/"):
                  method = "STORED" if info.compress_type == zipfile.ZIP_STORED else "DEFLATED"
                  print(f"  {info.filename}  {info.file_size} octets  {method}")

          # Le paquet de points de repère doit être là et porter ses deux modèles internes. Un
          # paquet tronqué se chargerait sans lever d'erreur, et la main ne serait simplement
          # jamais détectée — un défaut qui n'apparaîtrait qu'à l'usage, sur l'appareil.
          #
          # Le classifieur de poses a disparu avec le vocabulaire de poses : `gesture_recognizer`
          # est redevenu `hand_landmarker`, soit 554 Ko et une inférence par image en moins.
          if not any("hand_landmarker.task" in n for n in names):
              print("::error::assets/hand_landmarker.task absent de l'APK.")
              sys.exit(1)
          if any("gesture_recognizer.task" in n for n in names):
              print("::error::gesture_recognizer.task est encore empaqueté : le classifieur de "
                    "poses a été retiré, son modèle ne doit plus peser dans l'APK.")
              sys.exit(1)

          bundle = io.BytesIO(apk.read(
              next(n for n in names if n.endswith("hand_landmarker.task"))))
          inner = zipfile.ZipFile(bundle).namelist()
          print("## Contenu du paquet de vision")
          for name in inner:
              print(f"  {name}")
          for required in ("hand_detector.tflite", "hand_landmarks_detector.tflite"):
              if required not in inner:
                  print(f"::error::{required} absent du paquet hand_landmarker.task.")
                  sys.exit(1)

          print("## Bibliothèques natives")
          libs = [n for n in names if n.endswith(".so")]
          if not libs:
              print("::error::Aucune bibliothèque native : MediaPipe ne pourra pas démarrer.")
              sys.exit(1)
          for lib in sorted(libs):
              print(f"  {lib}")
          PY

          echo "## Alignement des segments ELF (16 Ko requis sur Android 15+)"
          work=$(mktemp -d)
          unzip -q -o "$RELEASE_APK" 'lib/*' -d "$work" || true
          misaligned=0
          while IFS= read -r so; do
            align=$(readelf -lW "$so" 2>/dev/null | awk '$1=="LOAD" {print $NF}' | sort -u | tr '\n' ' ')
            echo "  $(basename "$(dirname "$so")")/$(basename "$so") : $align"
            case "$align" in
              *0x4000*|*0x10000*) ;;
              *) misaligned=$((misaligned + 1)) ;;
            esac
          done < <(find "$work/lib" -name '*.so' 2>/dev/null | sort)

          {
            echo "### Alignement des bibliothèques natives"
            echo ""
            if [ "$misaligned" -gt 0 ]; then
              echo "$misaligned bibliothèque(s) alignée(s) sur 4 Ko : le chargement échouera sur un"
              echo "appareil Android 15+ configuré en pages de 16 Ko."
            else
              echo "Toutes les bibliothèques sont compatibles 16 Ko."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Garde anti-régression : l'alignement 4 Ko de MediaPipe a coûté un cycle complet de
          # diagnostic parce qu'il ne se manifestait qu'à l'exécution, sur certains appareils.
          # Une montée de version qui le réintroduirait doit casser le build, pas passer inaperçue.
          if [ "$misaligned" -gt 0 ]; then
            echo "::error::$misaligned bibliothèque(s) native(s) alignée(s) sur 4 Ko. Elles échoueront à se charger sur un appareil Android 15+ configuré en pages de 16 Ko, rendant le suivi de main indisponible."
            exit 1
          fi
          echo "  Toutes les bibliothèques sont compatibles 16 Ko."

      # Les APK sont publiées comme assets de release, et non comme artefacts Actions : les
      # assets de release ne consomment pas le quota de stockage des artefacts, et l'URL de
      # téléchargement reste stable au lieu d'expirer avec la rétention.
      #
      # Le tag est glissant : il est supprimé puis recréé sur le commit courant à chaque build,
      # ce qui garde une adresse de téléchargement permanente pour la dernière version.
      - name: Publier l'APK dans la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
        run: |
          set -euo pipefail

          assets=("$RELEASE_APK")
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt mapping-r8.txt
            assets+=("mapping-r8.txt")
          fi

          if [ "${SIGNED_WITH:-debug}" = "release" ]; then
            signature_note=$(cat <<'SIG'
          Elle est **signée avec la clé de release** du dépôt : publiable, et chaque build
          s'installe par-dessus le précédent. L'empreinte du certificat est affichée dans le
          journal du build, à l'étape « Vérifier que l'APK est signée ».
          SIG
            )
          else
            signature_note=$(cat <<'SIG'
          ### Désinstallez l'application avant d'installer celle-ci

          Faute de clé de release, le build retombe sur la clé de debug **interne à Gradle**, qui
          vit dans `~/.android/debug.keystore`. Ce fichier n'existe pas sur un runner neuf : Gradle
          en génère un, avec une clé **aléatoire**, à chaque build. Deux APK d'ici n'ont donc jamais
          la même signature, et Android refuse d'installer par-dessus une signature différente — le
          message affiché est « Application non installée », qui ne dit pas pourquoi.

          Il faut donc désinstaller « A » d'abord, ce qui efface les réglages et l'autorisation
          d'accessibilité. **Déposer les quatre secrets de signature supprime cette contrainte pour
          de bon** : `RELEASE_KEYSTORE_BASE64`, `RELEASE_STORE_PASSWORD`, `RELEASE_KEY_ALIAS`,
          `RELEASE_KEY_PASSWORD`. Voir la section « Signature » du README.

          Cette APK n'est de toute façon pas publiable : la clé de debug est, par construction,
          connue de tous.
          SIG
            )
          fi

          cat > notes.md <<NOTES
          Build installable depuis \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:7}\`), version
          \`${GITHUB_RUN_NUMBER}\`.

          L'APK à installer est \`$RELEASE_APK\`.

          $signature_note

          En cas de « moteur de vision indisponible », le message affiché dans l'application
          porte la version d'Android, l'ABI et la taille de page de l'appareil : c'est ce qui
          distingue un refus de chargement d'un échec d'initialisation.
          NOTES

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "A — builds de test" \
            --prerelease \
            --notes-file notes.md

          gh release upload "$TAG" "${assets[@]}" --clobber

          echo "URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${RELEASE_APK}" >> "$GITHUB_ENV"

      # La clé ne doit pas survivre au build, même si une étape a échoué avant.
      - name: Effacer la clé de signature
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### APK installable"
            echo ""
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Téléchargement | ${URL:-non publié} |"
            echo "| Signature | ${SIGNED_WITH:-debug} |"
            echo "| Version | \`${GITHUB_RUN_NUMBER}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

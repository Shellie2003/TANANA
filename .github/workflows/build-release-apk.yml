# Assemble NEXUS en une APK installable, signée avec la clé de debug.
name: APK installable (signée debug)

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# Écriture nécessaire pour publier l'APK dans une release.
permissions:
  contents: write

# Un push qui en remplace un autre sur la même référence annule le build précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assembler les APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_APK: nexus-release.apk

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # AGP 9.1.1 exige JDK 17 au minimum.
      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fournit le SDK Android et accepte les licences, sans quoi AGP ne peut pas
      # télécharger la plateforme compileSdk 36.1.
      #
      # `packages: tools platform-tools` est la valeur par défaut de l'action, et elle est
      # désormais cassée : Google a retiré le paquet `tools` de son dépôt, si bien que sdkmanager
      # échoue sur « Failed to find package 'tools' » avant même que le build ne commence. Le
      # paquet était de toute façon obsolète et inutile ici — AGP télécharge lui-même la
      # plateforme et les build-tools dont il a besoin. On ne demande donc que platform-tools.
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Met en cache les dépendances et la distribution Gradle entre deux exécutions.
      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      # Les tests du moteur gestuel tournent sur JVM : quelques secondes, sans émulateur.
      # Ils s'exécutent avant l'assemblage pour échouer au plus tôt.
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      # Artefact secondaire : son échec (quota de stockage saturé, par exemple) ne doit pas
      # masquer le résultat des tests eux-mêmes.
      - name: Publier les rapports de test
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3

      # Une seule variante.
      #
      # Le build produisait aussi une APK debug, qui servait de témoin : le moteur de vision
      # fonctionnait en debug et échouait en release, et comme les deux variantes ne différaient
      # que par R8, l'écart entre elles désignait la cause. La minification étant désormais
      # désactivée, les deux archives sont fonctionnellement identiques : la seconde ne répond
      # plus à aucune question et doublait la durée du build.
      #
      # Si la minification est réactivée, rétablir `assembleDebug` et la comparaison des dex
      # supprimée plus bas : c'est le seul garde-fou contre une classe retirée par R8, un défaut
      # qui ne produit aucune erreur de compilation.
      #
      # starkDebugSigning signe la release avec la clé de debug pour la rendre installable.
      - name: Assembler l'APK
        run: ./gradlew assembleRelease -PstarkDebugSigning=true

      - name: Vérifier que l'APK est signée
        run: |
          set -euo pipefail

          check() {
            local apk="$1" label="$2"
            if [ ! -f "$apk" ]; then
              echo "::error::APK $label introuvable ($apk)"
              exit 1
            fi
            echo "$label : $(du -h "$apk" | cut -f1)"
            # Une APK signée porte un bloc de signature v1 (META-INF/*.RSA) ou v2/v3
            # (APK Signing Block, invisible dans la liste zip). apksigner tranche sans ambiguïté.
            local apksigner
            apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
            if ! "$apksigner" verify --print-certs "$apk" > /dev/null 2>&1; then
              echo "::error::$label n'est pas signée : elle ne pourra pas être installée."
              exit 1
            fi
            echo "  signature vérifiée"
          }

          release=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          check "$release" "release"

          cp "$release" "$RELEASE_APK"

      # Diagnostic d'empaquetage. Un « module de vision indisponible » sur appareil a trois
      # causes possibles, que cette étape distingue sans avoir besoin du téléphone :
      #   1. le modèle absent de l'archive ;
      #   2. les bibliothèques natives de MediaPipe absentes ;
      #   3. des segments ELF alignés sur 4 Ko, que les appareils Android 15+ à pages de 16 Ko
      #      refusent de charger — le cas le plus insidieux, car tout compile normalement.
      - name: Diagnostic de l'APK
        run: |
          set -euo pipefail

          python3 - "$RELEASE_APK" <<'PY'
          import io, sys, zipfile
          apk = zipfile.ZipFile(sys.argv[1])
          names = apk.namelist()

          model = [n for n in names if n.startswith("assets/")]
          print("## Assets embarqués")
          if not model:
              print("::error::Aucun asset dans l'APK : le modèle n'a pas été empaqueté.")
              sys.exit(1)
          for info in apk.infolist():
              if info.filename.startswith("assets/"):
                  method = "STORED" if info.compress_type == zipfile.ZIP_STORED else "DEFLATED"
                  print(f"  {info.filename}  {info.file_size} octets  {method}")

          # Le paquet du reconnaisseur contient le modèle de points de repère *et* le classifieur
          # de poses. Vérifier qu'il est là et qu'il porte bien les deux : un paquet tronqué se
          # chargerait sans erreur, et le classifieur s'abstiendrait silencieusement — la pose
          # serait alors toujours décidée par le repli géométrique, sans que rien ne le signale.
          if not any("gesture_recognizer.task" in n for n in names):
              print("::error::assets/gesture_recognizer.task absent de l'APK.")
              sys.exit(1)

          bundle = io.BytesIO(apk.read(
              next(n for n in names if n.endswith("gesture_recognizer.task"))))
          inner = zipfile.ZipFile(bundle).namelist()
          print("## Contenu du paquet de vision")
          for name in inner:
              print(f"  {name}")
          for required in ("hand_landmarker.task", "hand_gesture_recognizer.task"):
              if required not in inner:
                  print(f"::error::{required} absent du paquet gesture_recognizer.task.")
                  sys.exit(1)

          print("## Bibliothèques natives")
          libs = [n for n in names if n.endswith(".so")]
          if not libs:
              print("::error::Aucune bibliothèque native : MediaPipe ne pourra pas démarrer.")
              sys.exit(1)
          for lib in sorted(libs):
              print(f"  {lib}")
          PY

          echo "## Alignement des segments ELF (16 Ko requis sur Android 15+)"
          work=$(mktemp -d)
          unzip -q -o "$RELEASE_APK" 'lib/*' -d "$work" || true
          misaligned=0
          while IFS= read -r so; do
            align=$(readelf -lW "$so" 2>/dev/null | awk '$1=="LOAD" {print $NF}' | sort -u | tr '\n' ' ')
            echo "  $(basename "$(dirname "$so")")/$(basename "$so") : $align"
            case "$align" in
              *0x4000*|*0x10000*) ;;
              *) misaligned=$((misaligned + 1)) ;;
            esac
          done < <(find "$work/lib" -name '*.so' 2>/dev/null | sort)

          {
            echo "### Alignement des bibliothèques natives"
            echo ""
            if [ "$misaligned" -gt 0 ]; then
              echo "$misaligned bibliothèque(s) alignée(s) sur 4 Ko : le chargement échouera sur un"
              echo "appareil Android 15+ configuré en pages de 16 Ko."
            else
              echo "Toutes les bibliothèques sont compatibles 16 Ko."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Garde anti-régression : l'alignement 4 Ko de MediaPipe a coûté un cycle complet de
          # diagnostic parce qu'il ne se manifestait qu'à l'exécution, sur certains appareils.
          # Une montée de version qui le réintroduirait doit casser le build, pas passer inaperçue.
          if [ "$misaligned" -gt 0 ]; then
            echo "::error::$misaligned bibliothèque(s) native(s) alignée(s) sur 4 Ko. Elles échoueront à se charger sur un appareil Android 15+ configuré en pages de 16 Ko, rendant le suivi de main indisponible."
            exit 1
          fi
          echo "  Toutes les bibliothèques sont compatibles 16 Ko."

      # Les APK sont publiées comme assets de release, et non comme artefacts Actions : les
      # assets de release ne consomment pas le quota de stockage des artefacts, et l'URL de
      # téléchargement reste stable au lieu d'expirer avec la rétention.
      #
      # Le tag est glissant : il est supprimé puis recréé sur le commit courant à chaque build,
      # ce qui garde une adresse de téléchargement permanente pour la dernière version.
      - name: Publier l'APK dans la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: unsigned-latest
        run: |
          set -euo pipefail

          assets=("$RELEASE_APK")
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt mapping-r8.txt
            assets+=("mapping-r8.txt")
          fi

          cat > notes.md <<NOTES
          Build installable depuis \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:7}\`).

          L'APK à installer est \`$RELEASE_APK\`.

          Elle est **signée avec la clé de debug** : installable pour tester, mais à ne
          jamais publier. Une vraie diffusion exige un keystore de release
          (\`KEYSTORE_PATH\`, \`KEY_ALIAS\`, \`STORE_PASSWORD\`, \`KEY_PASSWORD\`).

          En cas de « moteur de vision indisponible », le message affiché dans l'application
          porte la version d'Android, l'ABI et la taille de page de l'appareil : c'est ce qui
          distingue un refus de chargement d'un échec d'initialisation.
          NOTES

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "NEXUS — builds de test" \
            --prerelease \
            --notes-file notes.md

          gh release upload "$TAG" "${assets[@]}" --clobber

          echo "URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${RELEASE_APK}" >> "$GITHUB_ENV"

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### APK installable"
            echo ""
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Téléchargement | ${URL:-non publié} |"
            echo "| Signature | clé de debug — installable, non publiable |"
          } >> "$GITHUB_STEP_SUMMARY"

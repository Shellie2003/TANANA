# Assemble la variante release du Stark HUD Launcher, sans la signer.
name: APK release (non signée)

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# Écriture nécessaire pour publier l'APK dans une release.
permissions:
  contents: write

# Un push qui en remplace un autre sur la même référence annule le build précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assembler l'APK release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASSET_NAME: stark-hud-launcher-unsigned.apk

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # AGP 9.1.1 exige JDK 17 au minimum.
      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fournit le SDK Android et accepte les licences, sans quoi AGP ne peut pas
      # télécharger la plateforme compileSdk 36.1.
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      # Met en cache les dépendances et la distribution Gradle entre deux exécutions.
      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      # Les tests du moteur gestuel tournent sur JVM : quelques secondes, sans émulateur.
      # Ils s'exécutent avant l'assemblage pour échouer au plus tôt.
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      # Artefact secondaire : son échec (quota de stockage saturé, par exemple) ne doit pas
      # masquer le résultat des tests eux-mêmes.
      - name: Publier les rapports de test
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3

      # Aucun keystore n'est fourni : la configuration de signature n'est pas créée et AGP
      # produit app-release-unsigned.apk.
      - name: Assembler l'APK release non signée
        run: ./gradlew assembleRelease

      - name: Vérifier que l'APK est bien non signée
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::Aucune APK produite dans app/build/outputs/apk/release"
            exit 1
          fi
          echo "APK produite : $apk ($(du -h "$apk" | cut -f1))"
          # Une APK signée contient un bloc META-INF/*.RSA|DSA|EC ; son absence confirme
          # que l'artefact devra être signé avant toute installation ou publication.
          if unzip -l "$apk" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)$'; then
            echo "::warning::L'APK semble signée alors qu'aucun keystore n'était attendu."
          else
            echo "Confirmé : APK non signée."
          fi

      # L'APK est publiée comme asset de release, et non comme artefact Actions : les assets de
      # release ne consomment pas le quota de stockage des artefacts, et l'URL de téléchargement
      # reste stable au lieu d'expirer avec la rétention.
      #
      # Le tag est glissant : il est supprimé puis recréé sur le commit courant à chaque build,
      # ce qui garde une adresse de téléchargement permanente pour la dernière version.
      - name: Publier l'APK dans la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: unsigned-latest
        run: |
          set -euo pipefail

          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          cp "$apk" "$ASSET_NAME"

          # Les fichiers à joindre sont accumulés dans un tableau : la table de correspondance
          # n'existe que si la minification a tourné.
          assets=("$ASSET_NAME")
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt mapping-r8.txt
            assets+=("mapping-r8.txt")
          fi

          # Notes rédigées dans un fichier plutôt qu'en --notes inline : plus lisible, et sans
          # les pièges de quoting d'un argument multiligne contenant des backticks.
          cat > notes.md <<NOTES
          APK **non signée**, produite automatiquement depuis \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:7}\`).

          Une APK non signée ne s'installe pas telle quelle. Signez-la d'abord :

          \`\`\`bash
          apksigner sign --ks ma-cle.jks --out stark-hud-launcher.apk $ASSET_NAME
          \`\`\`

          \`mapping-r8.txt\` permet de désobfusquer les traces de plantage de cette build.
          NOTES

          # Tag glissant : supprimé puis recréé sur le commit courant, pour que l'adresse de
          # téléchargement de la dernière version reste identique d'un build à l'autre.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Stark HUD Launcher — build non signé" \
            --prerelease \
            --notes-file notes.md

          gh release upload "$TAG" "${assets[@]}" --clobber

          echo "URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### APK release non signée"
            echo ""
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Téléchargement | ${URL:-non publié} |"
            echo "| Signature | aucune — à signer avec \`apksigner\` avant installation |"
          } >> "$GITHUB_STEP_SUMMARY"
